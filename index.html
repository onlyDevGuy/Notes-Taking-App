<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Notes</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-top">
                <h1><i class="fas fa-sticky-note"></i> Smart Notes</h1>
                <div class="header-controls">
                    <!-- Search -->
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="searchNotes" placeholder="Search notes...">
                    </div>

                    <!-- Sort -->
                    <select id="sortNotes">
                        <option value="newest">Newest First</option>
                        <option value="oldest">Oldest First</option>
                        <option value="title">By Title</option>
                    </select>

                    <!-- View Mode -->
                    <button id="viewModeToggle" class="btn-icon" title="Switch view">
                        <i class="fas fa-th-large"></i>
                    </button>

                    <!-- Export -->
                    <button id="exportBtn" class="btn-icon" title="Export notes">
                        <i class="fas fa-download"></i>
                    </button>

                    <!-- Import -->
                    <label class="btn-icon" title="Import notes">
                        <i class="fas fa-upload"></i>
                        <input type="file" id="importFile" accept=".json" style="display: none;">
                    </label>

                    <!-- Dark Mode -->
                    <button id="darkModeToggle" class="btn-icon" title="Toggle dark mode">
                        <i class="fas fa-moon"></i>
                    </button>

                    <!-- Add Note -->
                    <button id="addBtn" class="btn-primary">
                        <i class="fas fa-plus"></i>
                        <span>New Note</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main id="main" class="notes-container">
            <!-- Notes will be rendered here -->
        </main>
    </div>

    <!-- Notification -->
    <div id="notification" class="notification"></div>

    <!-- Color Palette Modal -->
    <div id="colorPalette" class="color-palette">
        <div class="color-option" data-color="#ffffff" style="background-color: #ffffff;" title="White"></div>
        <div class="color-option" data-color="#fff9c4" style="background-color: #fff9c4;" title="Yellow"></div>
        <div class="color-option" data-color="#c8e6c9" style="background-color: #c8e6c9;" title="Green"></div>
        <div class="color-option" data-color="#bbdefb" style="background-color: #bbdefb;" title="Blue"></div>
        <div class="color-option" data-color="#f8bbd0" style="background-color: #f8bbd0;" title="Pink"></div>
        <div class="color-option" data-color="#e1bee7" style="background-color: #e1bee7;" title="Purple"></div>
    </div>

    <!-- Loading Spinner -->
    <div id="loadingSpinner" class="loading-spinner">
        <div class="spinner"></div>
        <p>Loading notes...</p>
    </div>

    <script src="gui.js"></script>
</body>
</html>
